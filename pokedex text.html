    const tierColors = {
      "LC": "tier-lc",
      "NU": "tier-nu",
      "UU": "tier-uu",
      "OU": "tier-ou",
      "Ubers": "tier-ubers"
    };

    const colors = ['#ef4444', '#f97316', '#eab308', '#22c55e', '#06b6d4', '#3b82f6', '#a855f7', '#ec4899'];
    const grid = document.getElementById('pokemon-grid');
    const overlay = document.getElementById('modal-overlay');
    const modalContent = document.getElementById('modal-content');
    const closeButton = document.getElementById('modal-close');

    function getColor(id) {
      return colors[(id - 1) % colors.length];
    }

    function getPokemonImageUrl(id) {
      return `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-v/black-white/${id}.png`;
    }

    function getStatColor(value) {
      if (value >= 70) return 'high';
      if (value >= 40) return 'medium';
      return 'low';
    }

    function getStatPercentage(value) {
      return Math.min((value / 120) * 100, 100);
    }

    function generateDifficultyStars(level) {
      return Array(level).fill('⭐').join('');
    }

    function renderCards() {
      grid.innerHTML = pokemons.map(pokemon => `
        <div class="card" onclick="openModal(${pokemon.id})">
          <span class="number">#${String(pokemon.id).padStart(3, '0')}</span>
          <img src="${getPokemonImageUrl(pokemon.id)}" alt="${pokemon.name}" class="pokemon-image" onerror="this.style.display='none'">
          <h2>${pokemon.name}</h2>
          <p class="type">${pokemon.type}</p>
          <p class="description">${pokemon.description}</p>
        </div>
      `).join('');
    }

    function openModal(pokemonId) {
      const pokemon = pokemons.find(p => p.id === pokemonId);
      const details = detailsById[pokemonId] || { stats: {}, moves: [], competitiveItems: [], peso: 'N/A', altura: 'N/A', evolucion: 'N/A', trivia: 'N/A', ability: 'N/A', nature: 'N/A', evs: 'N/A', role: 'N/A', tier: 'N/A', difficulty: 1, strengths: [], weaknesses: [] };

      const statsHtml = Object.entries(details.stats).map(([name, value]) => {
        const percentage = getStatPercentage(value);
        const color = getStatColor(value);
        return `
          <div class="stat-item">
            <div class="stat-name"><span>${name}</span><span>${value}</span></div>
            <div class="stat-bar"><div class="stat-fill ${color}" style="width: ${percentage}%"></div></div>
          </div>
        `;
      }).join('');

      const movesHtml = details.moves.map(move => `<li>${move}</li>`).join('');
      const itemsHtml = details.competitiveItems.map(item => `<li>${item}</li>`).join('');
      const strengthsHtml = details.strengths.map(str => `<li>${str}</li>`).join('');
      const weaknessesHtml = details.weaknesses.map(weak => `<li>${weak}</li>`).join('');
      
      const tierClass = tierColors[details.tier] || 'tier-nu';

      modalContent.innerHTML = `
        <div class="modal-header">
          <img src="${getPokemonImageUrl(pokemon.id)}" alt="${pokemon.name}" class="pokemon-image-modal" onerror="this.style.display='none'">
          <div>
            <h2 class="modal-title">${pokemon.name}</h2>
            <p class="modal-subtitle">${pokemon.type}</p>
          </div>
        </div>

        <div class="info-grid">
          <div class="info-box">
            <div class="info-label">Altura</div>
            <div class="info-value">${details.altura}</div>
          </div>
          <div class="info-box">
            <div class="info-label">Peso</div>
            <div class="info-value">${details.peso}</div>
          </div>
        </div>

        <div class="section-title">⚡ Análisis Competitivo</div>
        <div class="competitive-grid">
          <div class="competitive-box">
            <label>Habilidad Recomendada</label>
            <value>${details.ability}</value>
          </div>
          <div class="competitive-box">
            <label>Naturaleza</label>
            <value>${details.nature}</value>
          </div>
          <div class="competitive-box">
            <label>EVs Recomendados</label>
            <value>${details.evs}</value>
          </div>
          <div class="competitive-box">
            <label>Rol Competitivo</label>
            <value><span class="role-badge">${details.role}</span></value>
          </div>
        </div>

        <div class="section-title">📊 Tier e Información</div>
        <div style="margin: 1rem 0;">
          <span class="tier-badge ${tierClass}">Tier: ${details.tier}</span>
          <div class="difficulty-indicator" style="margin-top: 0.8rem;">
            <span>Dificultad de Uso:</span> <span class="difficulty-star">${generateDifficultyStars(details.difficulty)}</span>
          </div>
        </div>

        <div class="section-title">📈 Estadísticas</div>
        ${statsHtml}

        <div class="section-title">💪 Fortalezas</div>
        <ul class="strengths-list">${strengthsHtml}</ul>

        <div class="section-title">⚠️ Debilidades</div>
        <ul class="weaknesses-list">${weaknessesHtml}</ul>

        <div class="section-title">🔄 Evolución</div>
        <div class="evolution-info">${details.evolucion}</div>

        <div class="section-title">💡 Trivia</div>
        <div class="trivia-info">${details.trivia}</div>

        <div class="section-title">🎯 Movimientos</div>
        <ul class="moves-list">${movesHtml}</ul>

        <div class="section-title">🛡️ Items Competitivos</div>
        <ul class="items-list">${itemsHtml}</ul>
      `;

      overlay.classList.add('active');
    }

    function closeModal() {
      overlay.classList.remove('active');
    }

    closeButton.addEventListener('click', closeModal);
    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) closeModal();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });

    renderCards();
  </script>
